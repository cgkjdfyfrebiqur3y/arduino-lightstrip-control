name: Generate Changelog

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "CHANGELOG.md"
      - ".github/changelog-pending.md"

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  changelog:
    runs-on: ubuntu-latest

    # Only generate from pushes and PR closure.
    if: github.event_name == 'push' || github.event.action == 'closed'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Process changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          DATE="$(date -u '+%Y-%m-%d')"
          SHA="${GITHUB_SHA:0:7}"

          SUBJECT="$(git log -1 --pretty=%s "$GITHUB_SHA")"
          BODY="$(git log -1 --pretty=%b "$GITHUB_SHA")"
          AUTHOR="$(git log -1 --pretty=%an "$GITHUB_SHA")"

          MESSAGE="${SUBJECT}
          ${BODY}"

          echo "Commit: $SUBJECT"

          # --------------------------------------------------
          # NO-UPDATE
          # --------------------------------------------------

          if printf '%s\n' "$MESSAGE" | grep -q 'NO-UPDATE'; then
            echo "NO-UPDATE found. Nothing will be added."
            exit 0
          fi

          # --------------------------------------------------
          # Prepare files
          # --------------------------------------------------

          touch .github/changelog-pending.md

          if [ ! -f CHANGELOG.md ]; then
            cat > CHANGELOG.md <<'EOF'
          # Changelog

          All notable changes to this project are documented here.

          EOF
          fi

          # Don't process the same commit twice.
          if grep -q "commit ${SHA}" CHANGELOG.md ||
             grep -q "commit ${SHA}" .github/changelog-pending.md; then
            echo "Commit ${SHA} has already been processed."
            exit 0
          fi

          ENTRY="- ${SUBJECT} — ${AUTHOR} (commit ${SHA})"

          # --------------------------------------------------
          # UPDATE-SUPRESS
          # --------------------------------------------------

          if printf '%s\n' "$MESSAGE" | grep -q 'UPDATE-SUPRESS'; then
            echo "UPDATE-SUPRESS found."
            echo "Storing update for the next non-suppressed commit."

            {
              echo "$ENTRY"
            } >> .github/changelog-pending.md

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add .github/changelog-pending.md

            if ! git diff --cached --quiet; then
              git commit -m "chore: store pending changelog update"
              git push
            fi

            exit 0
          fi

          # --------------------------------------------------
          # NORMAL UPDATE
          # --------------------------------------------------

          echo "Normal commit. Updating changelog."

          {
            echo "## ${DATE}"
            echo
            echo "$ENTRY"

            # Flush suppressed updates.
            if [ -s .github/changelog-pending.md ]; then
              echo
              echo "### Previous suppressed updates"
              cat .github/changelog-pending.md
            fi

            echo
          } > /tmp/changelog-entry

          {
            head -n 4 CHANGELOG.md
            cat /tmp/changelog-entry
            tail -n +5 CHANGELOG.md
          } > /tmp/CHANGELOG.md

          mv /tmp/CHANGELOG.md CHANGELOG.md

          # Clear pending updates after flushing them.
          : > .github/changelog-pending.md

          # --------------------------------------------------
          # Commit changes
          # --------------------------------------------------

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md .github/changelog-pending.md

          if git diff --cached --quiet; then
            echo "No changelog changes."
            exit 0
          fi

          git commit -m "docs: update changelog"
          git push
